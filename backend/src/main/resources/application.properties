server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/oms_db}
spring.datasource.username=${DB_USERNAME:oms_user}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
